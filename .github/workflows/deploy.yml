name: Deploy to Cloudflare Pages

# Push-to-deploy for the direct-upload `toroid-fyi` Pages project.
# (The project is not natively Git-connected, so this Action publishes it.)
# Requires two repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The repo carries a Worker wrangler.jsonc (unused). Remove it from the
      # checkout so `pages deploy` doesn't try to read it as Pages config.
      # The repo's working notes (README, DEPLOY, COLLAB) and the build tools
      # stay in the repo and off the public site.
      - name: Keep repo-only files out of the upload
        run: rm -rf wrangler.jsonc README.md DEPLOY.md COLLAB.md tools

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=toroid-fyi --branch=main --commit-dirty=true
