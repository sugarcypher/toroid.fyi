<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>toroid.fyi</title>
  <meta name="description" content="A descent through toroidal instruments.">
  <meta name="theme-color" content="#040209">
  <meta property="og:title" content="toroid.fyi">
  <meta property="og:description" content="Enter the loop.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='none' stroke='%23b6a4ff' stroke-width='2'/><circle cx='16' cy='16' r='5' fill='none' stroke='%23b6a4ff' stroke-width='1.5'/></svg>">
  <style>
    :root {
      --bg:#040209;
      --fg:#e6e3f5;
      --muted:#6a6480;
      --accent:#b6a4ff;
    }
    *,*::before,*::after { box-sizing:border-box; }
    html,body { margin:0; padding:0; background:var(--bg); color:var(--fg); overflow:hidden; height:100vh; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    canvas { display:block; }

    #stage { position:fixed; inset:0; }

    /* Centered minimal type — fades on enter */
    #title {
      position:fixed; left:50%; bottom:13vh; transform:translateX(-50%);
      z-index:5; text-align:center; pointer-events:none;
      transition:opacity 900ms ease, transform 900ms ease;
    }
    #title h1 {
      margin:0; font-weight:200; letter-spacing:0.32em;
      font-size:clamp(20px, 2.4vw, 28px); color:var(--fg);
      text-transform:lowercase;
    }
    #title h1 b { color:var(--accent); font-weight:400; letter-spacing:0.32em; }
    #title .sub {
      margin-top:14px; font-size:11px; letter-spacing:0.28em;
      color:var(--muted); font-family:ui-monospace,Menlo,monospace; text-transform:uppercase;
    }

    #enter {
      position:fixed; left:50%; bottom:6vh; transform:translateX(-50%);
      z-index:10; pointer-events:auto;
      padding:14px 38px; border-radius:999px;
      background:rgba(0,0,0,0); border:1px solid rgba(182,164,255,0.35);
      color:var(--fg); font-size:12px; font-weight:400; letter-spacing:0.42em;
      text-transform:uppercase; cursor:pointer;
      transition:all 380ms cubic-bezier(.4,0,.2,1);
      backdrop-filter:blur(6px);
    }
    #enter:hover { border-color:var(--accent); background:rgba(182,164,255,0.06); letter-spacing:0.50em; padding:14px 46px; }

    body.descending #title { opacity:0; transform:translateX(-50%) translateY(8px); }
    body.descending #enter { opacity:0; pointer-events:none; transform:translateX(-50%) translateY(8px); transition:opacity 380ms ease; }

    /* Segment labels — appear only after disassembly */
    #segment-labels {
      position:fixed; inset:0; z-index:6; pointer-events:none; opacity:0;
      transition:opacity 700ms ease 350ms;
    }
    body.disassembled #segment-labels { opacity:1; }
    .seg-label {
      position:absolute; pointer-events:auto; cursor:pointer;
      padding:6px 14px; border-radius:999px;
      background:rgba(8,4,18,0.55); border:1px solid rgba(182,164,255,0.30);
      color:var(--fg); font-size:10px; letter-spacing:0.36em; text-transform:uppercase;
      font-family:ui-monospace,Menlo,monospace;
      backdrop-filter:blur(6px);
      transform:translate(-50%, -50%);
      transition:all 240ms cubic-bezier(.4,0,.2,1);
      white-space:nowrap;
    }
    .seg-label:hover { color:var(--accent); border-color:var(--accent); background:rgba(182,164,255,0.10); }
    .seg-label::after { content:''; display:inline-block; margin-left:8px; opacity:0.5; }
    .seg-label:hover::after { content:'→'; opacity:1; color:var(--accent); }

    /* Vignette */
    body::after {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:1;
      background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.55) 100%);
    }

    /* Reduced motion respect */
    @media (prefers-reduced-motion: reduce){
      * { transition-duration:0ms !important; animation-duration:0ms !important; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <div id="title">
    <h1>toroid<b>.fyi</b></h1>
    <div class="sub">a descent</div>
  </div>

  <button id="enter" aria-label="Enter">Enter</button>

  <div id="segment-labels"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  (() => {
    const stage = document.getElementById('stage');
    const enterBtn = document.getElementById('enter');
    const labelHost = document.getElementById('segment-labels');

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x040209, 6, 20);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 9);

    scene.add(new THREE.AmbientLight(0xffffff, 0.35));
    const rim = new THREE.PointLight(0xb6a4ff, 1.4, 30); rim.position.set(5, 6, 5); scene.add(rim);
    const fill = new THREE.PointLight(0x7c50e0, 0.7, 30); fill.position.set(-6, -4, 4); scene.add(fill);
    const back = new THREE.PointLight(0xe08b54, 0.4, 20); back.position.set(0, 0, -6); scene.add(back);

    // === Build a torus from N angular SEGMENTS, each a separate mesh ===
    const SEG_COUNT = 16;
    const R = 2.2;          // torus major radius
    const r = 0.55;         // torus minor radius
    const TUBE_DETAIL = 24;
    const segments = [];

    // Each segment is a partial-arc torus geometry — we use the standard
    // THREE.TorusGeometry but limit the arc range, then rotate each segment
    // around the Y axis so they ring up correctly.
    const segArc = (2 * Math.PI) / SEG_COUNT;
    for (let i = 0; i < SEG_COUNT; i++){
      const segGeo = new THREE.TorusGeometry(R, r, 12, TUBE_DETAIL, segArc);
      const segMat = new THREE.MeshStandardMaterial({
        color: 0x4a3a8a, emissive: 0x2a1f5a, emissiveIntensity: 0.45,
        metalness: 0.45, roughness: 0.35,
        transparent: true, opacity: 1.0,
      });
      const mesh = new THREE.Mesh(segGeo, segMat);
      // Rotate around Z axis by i * segArc so segments tile around. The torus
      // is in the X-Y plane by default; we'll tilt it later via group rotation.
      mesh.rotation.z = i * segArc;
      // Store original local transform for disassembly math
      const angle = i * segArc + segArc * 0.5;   // segment midpoint angle
      mesh.userData = {
        segIndex: i,
        angle,
        homePos: new THREE.Vector3(0, 0, 0),
        explodeDir: new THREE.Vector3(Math.cos(angle), Math.sin(angle), 0).normalize(),
        homeRotZ: i * segArc,
      };
      segments.push(mesh);
    }

    // Wrap segments in a tilt group so the whole torus tilts toward camera
    const torus = new THREE.Group();
    for (const s of segments) torus.add(s);
    torus.rotation.x = -0.45;       // tilt back
    torus.rotation.y = 0.12;
    scene.add(torus);

    // Soft inner glow (a faint sphere at center) — adds depth cue
    const glow = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 16, 12),
      new THREE.MeshBasicMaterial({ color: 0x7c50e0, transparent:true, opacity:0.12 })
    );
    scene.add(glow);

    // Particle dust field — sparse, subtle
    const dustCount = 220;
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount; i++){
      const r = 4 + Math.random() * 9;
      const a = Math.random() * Math.PI * 2;
      const b = (Math.random() - 0.5) * Math.PI;
      dustPos[i*3+0] = r * Math.cos(b) * Math.cos(a);
      dustPos[i*3+1] = r * Math.sin(b);
      dustPos[i*3+2] = r * Math.cos(b) * Math.sin(a);
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
      color: 0xb6a4ff, size: 0.020, transparent: true, opacity: 0.55, sizeAttenuation:true,
    }));
    scene.add(dust);

    // === State machine: 'assembled' → 'descending' → 'disassembled' ===
    let state = 'assembled';
    let t0 = performance.now();
    const SEG_PICK = [0, 4, 8, 12];     // four equally spaced segments → labelled destinations
    const DESTINATIONS = [
      { idx: 0,  name: 'Research', href: '/research/' },
      { idx: 4,  name: 'Systems',  href: '/systems/'  },
      { idx: 8,  name: 'Lore',     href: '/lore/'     },
      { idx:12,  name: 'Archive',  href: '/archive/'  },
    ];

    // Build the floating labels (positioned each frame in 3D → 2D projection)
    DESTINATIONS.forEach(d => {
      const el = document.createElement('a');
      el.className = 'seg-label';
      el.href = d.href;
      el.textContent = d.name;
      el.dataset.segIndex = d.idx;
      el.addEventListener('mouseenter', () => highlightSeg(d.idx, true));
      el.addEventListener('mouseleave', () => highlightSeg(d.idx, false));
      el.addEventListener('click', (e) => {
        e.preventDefault();
        descendInto(d);
      });
      labelHost.appendChild(el);
    });

    function highlightSeg(idx, on){
      const s = segments[idx];
      if (!s) return;
      s.material.emissive.setHex(on ? 0xb6a4ff : 0x2a1f5a);
      s.material.emissiveIntensity = on ? 1.2 : 0.45;
      s.scale.setScalar(on ? 1.08 : 1.0);
    }

    // Project a 3D point to 2D screen coords for label positioning
    const _v = new THREE.Vector3();
    function project(point){
      _v.copy(point).project(camera);
      return {
        x: (_v.x * 0.5 + 0.5) * window.innerWidth,
        y: (-_v.y * 0.5 + 0.5) * window.innerHeight,
        z: _v.z,
      };
    }

    function updateLabels(){
      const labels = labelHost.querySelectorAll('.seg-label');
      labels.forEach(el => {
        const idx = parseInt(el.dataset.segIndex, 10);
        const seg = segments[idx];
        if (!seg) return;
        // Position label at a point offset outward from segment center.
        // Each segment's midpoint in local torus space:
        const a = seg.userData.angle;
        const local = new THREE.Vector3(R * Math.cos(a) * 1.45, R * Math.sin(a) * 1.45, 0);
        local.applyMatrix4(torus.matrixWorld);
        const p = project(local);
        if (p.z > 1){ el.style.opacity = 0; return; }
        el.style.left = p.x + 'px';
        el.style.top  = p.y + 'px';
      });
    }

    // === Animations ===
    enterBtn.addEventListener('click', () => {
      if (state !== 'assembled') return;
      state = 'descending';
      document.body.classList.add('descending');
      // After 1100ms (title + button fade), trigger the disassembly
      setTimeout(() => {
        state = 'disassembled';
        document.body.classList.add('disassembled');
      }, 1100);
    });

    function descendInto(dest){
      if (state !== 'disassembled') return;
      state = 'transitioning';
      // Camera dollies in toward the chosen segment
      const target = segments[dest.idx];
      const wp = new THREE.Vector3();
      target.getWorldPosition(wp);
      // Tween camera + fade everything else
      const start = performance.now();
      const dur = 900;
      const camFrom = camera.position.clone();
      const camTo   = new THREE.Vector3(wp.x * 0.7, wp.y * 0.7, 2.0);
      const tick = (now) => {
        const t = Math.min(1, (now - start) / dur);
        const e = 0.5 - 0.5 * Math.cos(t * Math.PI);
        camera.position.lerpVectors(camFrom, camTo, e);
        camera.lookAt(wp);
        // fade non-target segments
        segments.forEach((s, i) => {
          if (i !== dest.idx) s.material.opacity = 1 - e * 0.95;
        });
        // fade labels
        labelHost.style.opacity = 1 - e;
        renderer.render(scene, camera);
        if (t < 1) requestAnimationFrame(tick);
        else { window.location.href = dest.href; }
      };
      requestAnimationFrame(tick);
    }

    // === Per-frame loop ===
    function tick(now){
      const elapsed = (now - t0) / 1000;

      // Ambient: gentle full-torus rotation
      torus.rotation.y += 0.0024;
      glow.rotation.y -= 0.001;

      // Dust slowly drifts
      dust.rotation.y += 0.00045;

      // Disassembly: segments translate outward + rotate slightly
      if (state === 'disassembled' || state === 'transitioning'){
        const targetExplode = 1.05;
        segments.forEach((s, i) => {
          const dir = s.userData.explodeDir;
          // Lerp to home + dir*targetExplode
          const target = new THREE.Vector3().copy(dir).multiplyScalar(targetExplode);
          s.position.lerp(target, 0.06);
          // Slight wobble per segment
          s.rotation.z = s.userData.homeRotZ + Math.sin(elapsed * 0.6 + i) * 0.02;
        });
        // Pulse the 4 pickable segments
        SEG_PICK.forEach(i => {
          const s = segments[i];
          const p = (Math.sin(elapsed * 1.7 + i) * 0.5 + 0.5);
          s.material.emissiveIntensity = 0.45 + p * 0.55;
        });
        updateLabels();
      } else {
        // Assembled: settle to origin
        segments.forEach(s => s.position.lerp(new THREE.Vector3(0,0,0), 0.1));
        // Breathe — gentle scale
        const breathe = 1 + Math.sin(elapsed * 0.7) * 0.012;
        torus.scale.setScalar(breathe);
      }

      renderer.render(scene, camera);
      if (state !== 'transitioning') requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // === Responsive ===
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // === Raycaster click on segments (alternate input) ===
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    renderer.domElement.addEventListener('mousemove', (e) => {
      if (state !== 'disassembled') return;
      const r = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      mouse.y = -((e.clientY - r.top) / r.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(segments, false);
      let hoverIdx = -1;
      if (hits.length){
        const idx = hits[0].object.userData.segIndex;
        if (SEG_PICK.includes(idx)) hoverIdx = idx;
      }
      // Toggle cursor + reset all non-pulse segments to baseline
      renderer.domElement.style.cursor = hoverIdx >= 0 ? 'pointer' : 'default';
      SEG_PICK.forEach(i => {
        if (i === hoverIdx){
          segments[i].material.emissive.setHex(0xb6a4ff);
          segments[i].scale.setScalar(1.10);
        } else {
          segments[i].material.emissive.setHex(0x2a1f5a);
          segments[i].scale.setScalar(1.0);
        }
      });
    });
    renderer.domElement.addEventListener('click', (e) => {
      if (state !== 'disassembled') return;
      const r = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      mouse.y = -((e.clientY - r.top) / r.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(segments, false);
      if (hits.length){
        const idx = hits[0].object.userData.segIndex;
        const dest = DESTINATIONS.find(d => d.idx === idx);
        if (dest) descendInto(dest);
      }
    });

  })();
  </script>
</body>
</html>
