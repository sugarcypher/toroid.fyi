<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>toroid.fyi</title>
  <meta name="description" content="Toroidal instruments for ThinkWell Labs Metrology. Bounded, edgeless, doubly periodic.">
  <meta name="theme-color" content="#0a0712">
  <meta property="og:title" content="toroid.fyi">
  <meta property="og:description" content="Three toroidal instruments. One research substrate.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='none' stroke='%23b6a4ff' stroke-width='2'/><circle cx='16' cy='16' r='5' fill='none' stroke='%23b6a4ff' stroke-width='1.5'/></svg>">
  <style>
    :root {
      --bg:#0a0712;
      --fg:#e6e3f5;
      --muted:#8a85a6;
      --accent:#b6a4ff;
      --warm:#e08b54;
    }
    *,*::before,*::after { box-sizing:border-box; }
    html,body { margin:0; padding:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    body { min-height:100vh; display:flex; flex-direction:column; }

    .hero {
      flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:6vh 6vw; text-align:center; position:relative; overflow:hidden;
    }
    .hero::before {
      content:''; position:absolute; inset:0;
      background:
        radial-gradient(60% 50% at 50% 45%, rgba(182,164,255,0.10), transparent 70%),
        radial-gradient(40% 30% at 50% 60%, rgba(224,139,84,0.06), transparent 75%);
      pointer-events:none;
    }
    .hero > * { position:relative; z-index:1; }

    .mark { width:min(180px, 30vw); height:auto; margin-bottom:36px; }
    .mark .ring { fill:none; stroke:var(--accent); }
    .mark .ring.outer { stroke-width:1.4; opacity:0.9; animation:spin 60s linear infinite; transform-origin:center; }
    .mark .ring.mid   { stroke-width:1.0; opacity:0.55; animation:spin 90s linear infinite reverse; transform-origin:center; }
    .mark .ring.inner { stroke-width:0.8; opacity:0.35; animation:spin 120s linear infinite; transform-origin:center; }
    @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }

    h1 { font-size:clamp(34px, 6vw, 60px); font-weight:300; letter-spacing:-0.02em; margin:0 0 12px; }
    h1 b { color:var(--accent); font-weight:500; }
    .tagline { font-size:clamp(15px, 1.6vw, 18px); color:var(--muted); max-width:560px; line-height:1.5; margin:0 auto 48px; }

    .enter {
      display:inline-flex; align-items:center; gap:10px;
      padding:14px 28px; border-radius:999px;
      background:linear-gradient(180deg, rgba(182,164,255,0.18), rgba(182,164,255,0.04));
      border:1.5px solid rgba(182,164,255,0.55);
      color:var(--fg); font-size:15px; font-weight:500; letter-spacing:0.02em;
      text-decoration:none; cursor:pointer;
      transition:all 200ms ease;
    }
    .enter:hover { background:rgba(182,164,255,0.25); transform:translateY(-1px); box-shadow:0 8px 24px rgba(124,80,224,0.30); }
    .enter .arrow { transition:transform 200ms ease; }
    .enter:hover .arrow { transform:translateX(4px); }

    nav.secondary {
      display:flex; gap:24px; justify-content:center; flex-wrap:wrap;
      margin-top:48px; font-size:13px; color:var(--muted);
    }
    nav.secondary a { color:var(--muted); text-decoration:none; transition:color 120ms ease; }
    nav.secondary a:hover { color:var(--accent); }

    footer {
      padding:24px 6vw; text-align:center; font-size:11px; color:var(--muted);
      border-top:1px solid rgba(255,255,255,0.05);
      font-family:ui-monospace,Menlo,monospace; letter-spacing:0.04em;
    }
    footer .accent { color:var(--accent); }

    @media (prefers-reduced-motion: reduce){
      .mark .ring { animation:none !important; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <svg class="mark" viewBox="0 0 200 200" aria-hidden="true">
      <ellipse class="ring outer" cx="100" cy="100" rx="80" ry="42"/>
      <ellipse class="ring mid"   cx="100" cy="100" rx="60" ry="30"/>
      <ellipse class="ring inner" cx="100" cy="100" rx="38" ry="18"/>
      <circle  class="ring outer" cx="100" cy="100" r="84" opacity="0.18"/>
    </svg>
    <h1>toroid<b>.fyi</b></h1>
    <p class="tagline">Bounded. Edgeless. Doubly periodic. Three instruments treating the torus as a research substrate.</p>
    <a class="enter" href="/game/">
      Enter the game
      <span class="arrow" aria-hidden="true">→</span>
    </a>
    <nav class="secondary" aria-label="Secondary">
      <a href="/about/">About</a>
      <a href="/mechanics/">Mechanics</a>
      <a href="/tour/">The instruments</a>
      <a href="/updates/">Updates</a>
    </nav>
  </main>
  <footer>
    <span class="accent">B. Greenway</span> · ThinkWell Labs Metrology · v0.1
  </footer>
</body>
</html>
