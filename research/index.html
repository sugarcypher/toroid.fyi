<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research · toroid.fyi</title>
  <meta name="theme-color" content="#040209">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='none' stroke='%23b6a4ff' stroke-width='2'/></svg>">
  <style>
    :root { --bg:#040209; --fg:#e6e3f5; --muted:#6a6480; --accent:#9adfe0; }
    *,*::before,*::after { box-sizing:border-box; }
    html,body { margin:0; padding:0; background:var(--bg); color:var(--fg); min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:0; background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.55) 100%); }

    /* Breadcrumb — sparse */
    .bread {
      position:fixed; top:24px; left:32px; z-index:10;
      font-family:ui-monospace,Menlo,monospace; font-size:10px;
      color:var(--muted); letter-spacing:0.28em; text-transform:uppercase;
    }
    .bread a { color:var(--muted); text-decoration:none; }
    .bread a:hover { color:var(--accent); }
    .bread .sep { margin:0 10px; opacity:0.5; }
    .bread .here { color:var(--fg); }

    main {
      position:relative; z-index:5;
      min-height:100vh; display:flex; flex-direction:column; justify-content:center;
      padding:120px 8vw 80px; max-width:780px; margin:0 auto;
    }

    h1 {
      font-weight:200; letter-spacing:0.04em;
      font-size:clamp(40px, 6vw, 64px); margin:0 0 6px;
    }
    h1 .accent { color:var(--accent); font-weight:300; }
    .lede {
      font-family:ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:0.30em;
      color:var(--muted); text-transform:uppercase; margin:0 0 56px;
    }
    .nodes {
      display:flex; flex-direction:column; gap:1px;
      border-top:1px solid rgba(182,164,255,0.12);
    }
    .node {
      display:flex; align-items:baseline; gap:24px;
      padding:24px 8px; border-bottom:1px solid rgba(182,164,255,0.12);
      color:var(--fg); text-decoration:none;
      transition:all 280ms cubic-bezier(.4,0,.2,1);
    }
    .node:hover { padding-left:24px; background:rgba(182,164,255,0.04); }
    .node .idx { font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--muted); letter-spacing:0.20em; flex-shrink:0; width:48px; }
    .node .name { font-size:22px; font-weight:300; letter-spacing:0.02em; flex:1; }
    .node:hover .name { color:var(--accent); }
    .node .arr { color:var(--muted); font-size:13px; transition:transform 220ms ease, color 220ms ease; }
    .node:hover .arr { color:var(--accent); transform:translateX(6px); }

    footer { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); font-family:ui-monospace,Menlo,monospace; font-size:9px; color:var(--muted); letter-spacing:0.32em; text-transform:uppercase; }
  </style>
</head>
<body>
  <div class="bread">
    <a href="/">surface</a>
    <span class="sep">/</span>
    <span class="here">research</span>
  </div>

  <main>
    <h1>Research<span class="accent">.</span></h1>
    <p class="lede">— Layer I · structural instruments</p>

    <div class="nodes">
      <a class="node" href="/research/circulatory-pressure/">
        <span class="idx">001</span>
        <span class="name">Circulatory Pressure Architectures</span>
        <span class="arr">→</span>
      </a>
      <a class="node" href="/research/polymorphic-matrix/">
        <span class="idx">002</span>
        <span class="name">Polymorphic Matrix · precursor model</span>
        <span class="arr">→</span>
      </a>
      <a class="node" href="/research/sabbotarchy/">
        <span class="idx">003</span>
        <span class="name">Obfuscratic Sabbotarchy</span>
        <span class="arr">→</span>
      </a>
      <a class="node" href="/research/methodology/">
        <span class="idx">004</span>
        <span class="name">Framework methodology</span>
        <span class="arr">→</span>
      </a>
    </div>
  </main>

  <footer>layer i · research</footer>
</body>
</html>
